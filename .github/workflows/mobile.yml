# Builds the Firebirds Nest staff app (mobile/, Expo / React Native) for
# Android whenever it changes, checks that it opens on an Android emulator,
# and (from main) puts the download on the "Firebirds Nest staff app" release:
#   https://github.com/JoeDaGoat1212/School-Store/releases/latest/download/firebirds-nest-staff.apk
name: Phone app

on:
  push:
    branches: [main, ci/auto-clock-out-check]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Test-branch builds talk to the fake store in the emulator test (mobile/test-server.js); main builds use the real website.
      APP_TEST_API: ${{ github.ref != 'refs/heads/main' && 'http://10.0.2.2:8787' || '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: |
          if grep -q '"expo"' package.json; then
            npm install --no-audit --no-fund
          else
            # First build: pick the newest Expo and the versions that go with it.
            npm install --no-audit --no-fund expo@latest
            npx expo install react react-native expo-constants expo-secure-store expo-haptics expo-status-bar expo-system-ui react-native-safe-area-context
            npx expo install typescript @types/react -- --save-dev
          fi
          echo "----- package.json -----"; cat package.json

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Make the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the app
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Name the download
        run: cp android/app/build/outputs/apk/release/app-release.apk firebirds-nest-staff.apk && ls -la firebirds-nest-staff.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: mobile/firebirds-nest-staff.apk
          if-no-files-found: error

  # Installs the app on an Android emulator, opens it and takes screenshots.
  try-it:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: mobile
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Start the fake store
        run: nohup node mobile/test-server.js > server.log 2>&1 &
      - name: Let the emulator use hardware speed-up
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r firebirds-nest-staff.apk
            adb shell pm grant com.firebirdsnest.staff android.permission.POST_NOTIFICATIONS || true
            adb shell monkey -p com.firebirdsnest.staff -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > shot-1-sign-in.png
            adb shell input tap 540 949
            sleep 1
            adb shell input text "Maya%sR"
            adb shell input keyevent 66
            adb shell input text "1234"
            adb shell input keyevent 66
            sleep 6
            adb exec-out screencap -p > shot-2-today.png
            adb shell cmd statusbar expand-notifications
            sleep 3
            adb exec-out screencap -p > shot-2b-notification.png
            adb shell cmd statusbar collapse
            sleep 2
            adb shell input tap 324 2275
            sleep 4
            adb exec-out screencap -p > shot-3-tasks.png
            adb shell input tap 540 2275
            sleep 4
            adb exec-out screencap -p > shot-4-chat.png
            adb shell input tap 540 560
            sleep 4
            adb exec-out screencap -p > shot-5-conversation.png
            adb shell input tap 756 2275
            sleep 4
            adb exec-out screencap -p > shot-6-schedule.png
            adb shell input swipe 540 1800 540 600 300
            sleep 2
            adb exec-out screencap -p > shot-7-absences.png
            adb shell input tap 108 2275
            sleep 2
            adb shell input swipe 540 700 540 2000 300
            sleep 2
            adb shell input tap 540 840
            sleep 5
            adb exec-out screencap -p > shot-8-clocked-in.png
            adb shell input tap 540 880
            sleep 6
            adb exec-out screencap -p > shot-9-restock.png
            adb shell input tap 972 2275
            sleep 3
            adb exec-out screencap -p > shot-10-credit.png
            if [ "$(adb shell getprop ro.build.version.sdk)" != "" ]; then adb shell cmd uimode night yes; fi
            sleep 3
            adb exec-out screencap -p > shot-11-credit-dark.png
            adb logcat -d -s ReactNativeJS:V AndroidRuntime:E | tail -40
            cat server.log
            adb shell pidof com.firebirdsnest.staff && echo "APP IS RUNNING" || (echo "APP CRASHED"; exit 1)
      - name: Save the screenshots on the test branch
        if: always() && github.ref != 'refs/heads/main'
        run: |
          mkdir -p shots && mv *.png shots/ 2>/dev/null || true
          git init -q repo && cd repo
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin "${{ github.ref_name }}" && git checkout -q FETCH_HEAD
          mkdir -p ci-preview/app-shots && cp ../shots/*.png ci-preview/app-shots/ 2>/dev/null || exit 0
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -f ci-preview/app-shots && git commit -qm "App screenshots [skip ci]" || exit 0
          git push -q origin HEAD:"${{ github.ref_name }}" || (git pull -q --rebase origin "${{ github.ref_name }}" && git push -q origin HEAD:"${{ github.ref_name }}")

  release:
    needs: [android, try-it]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk
      - name: Put the download on the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view staff-app >/dev/null 2>&1; then
            gh release create staff-app --target "$GITHUB_SHA" --title "Firebirds Nest staff app" \
              --notes "The employee app for Android: clock in and out, your discount, store credit and schedule. Download firebirds-nest-staff.apk on the phone and open it (Android asks to allow installs from your browser the first time)."
          fi
          gh release upload staff-app firebirds-nest-staff.apk --clobber
